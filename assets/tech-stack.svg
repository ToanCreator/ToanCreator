    .r4 { --d: 318px; animation: slide 19s ease-in-out infinite alternate; }
    .r5 { --d: 310px; animation: slide 22s ease-in-out infinite alternate-reverse; }
    .r6 { --d: 182px; animation: slide 18s ease-in-out infinite alternate; }
    @media (prefers-reduced-motion: reduce) { .r0, .r1, .r2, .r3, .r4, .r5, .r6 { animation: none; } }
  </style>
