  <title id="t">Tech Stack</title>
  <desc id="d">Languages: TypeScript, JavaScript, Python, Java. Frontend: React, Next.js, Tailwind, HTML, CSS. Backend: Node.js, Express, NestJS. Database: PostgreSQL, MySQL, MongoDB. Cloud and DevOps: AWS, GitHub Actions, Linux. AI and data: PyTorch, TensorFlow, OpenCV. Tools: Git, GitHub, VS Code, Figma, Bash.</desc>
