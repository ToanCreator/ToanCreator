    .title { font-size: 18px; fill: #FFFFFF; font-weight: 700; }
    .sub { font-size: 13px; fill: #BFE9FF; }
    .edge { animation: pulse 3.2s ease-in-out infinite; }
    .scan { animation: scan 7s linear infinite; }
    @keyframes pulse { 0%,100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; } }
    @keyframes scan { 0% { transform: translateX(-320px); } 45%,100% { transform: translateX(960px); } }
    @media (prefers-reduced-motion: reduce) { .edge, .scan { animation: none; } }
  </style>

